<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magar Dictionary</title>
<meta name="description" content="Dhut Magar dictionary with Khas Nepali and English translations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f2f6f3;
  --surface: #ffffff;
  --ink: #15231c;
  --muted: #5b6b62;
  --line: #d3ddd6;
  --magar: #176b4d;
  --nepali: #1565c0;
  --focus: #176b4d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1a15;
    --surface: #17261f;
    --ink: #e8f0ea;
    --muted: #9db0a5;
    --line: #2b4036;
    --magar: #5fd3a2;
    --nepali: #7ab4ff;
    --focus: #5fd3a2;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Nirmala UI", sans-serif;
  line-height: 1.5;
}
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; color: var(--magar); }
.sub { margin: .25rem 0 1.25rem; color: var(--muted); }
.search {
  width: 100%;
  font: inherit;
  font-size: 1.125rem;
  padding: .85rem 1rem;
  border: 2px solid var(--line);
  border-radius: .5rem;
  background: var(--surface);
  color: var(--ink);
}
.search:focus-visible, .chip:focus-visible, .more:focus-visible, .apk:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
.hint { margin: .75rem 0 0; color: var(--muted); font-size: .95rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
.chip {
  font: inherit;
  padding: .35rem .9rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--magar); border-color: var(--magar); color: var(--bg); font-weight: 600; }
.status { margin: 0 0 .75rem; color: var(--muted); font-size: .95rem; }
.list { list-style: none; margin: 0; padding: 0; }
.entry { padding: .9rem 0 .9rem 1rem; border-left: 4px solid var(--magar); border-bottom: 1px solid var(--line); }
.magar { margin: 0; font-size: 1.35rem; font-weight: 700; font-style: italic; color: var(--magar); }
.roman { margin: 0; color: var(--magar); }
.nepali { margin: .35rem 0 0; font-size: 1.15rem; font-weight: 600; color: var(--nepali); }
.english { margin: .1rem 0 0; color: var(--ink); }
.more {
  display: block; margin: 1.25rem auto 0; font: inherit; padding: .6rem 1.4rem;
  border: 1px solid var(--magar); border-radius: .5rem; background: transparent; color: var(--magar); cursor: pointer;
}
.apk {
  display: inline-block; margin-top: .25rem; padding: .5rem 1rem; border-radius: .5rem;
  background: var(--magar); color: var(--bg); text-decoration: none; font-weight: 600;
}
footer { margin-top: 2.5rem; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Magar Dictionary</h1>
  <p class="sub">Dhut Magar - Khas Nepali - English</p>
  <p id="apkWrap" hidden><a id="apk" class="apk" href="#">Download the Android app</a></p>

  <p id="status" class="status" aria-live="polite"></p>
  <ul id="list" class="list"></ul>
  <button id="more" class="more" hidden>Show more</button>

</main>

const PAGE = 100;
let language = "All";
let limit = PAGE;

const norm = s => s.normalize("NFC").replace(/[\u200c\u200d]/g, "").trim().toLowerCase();
// Loose key for romanization: ignores doubled letters (aa/a, ee/e) so spelling variants still match.
const loose = s => norm(s).replace(/(.)\1+/g, "$1");

const index = WORDS.map(w => ({
  magar: norm(w.magar),
  roman: norm(w.romanized),
  romanLoose: loose(w.romanized),
  nepali: norm(w.nepali),
  english: norm(w.english)
}));

const $ = id => document.getElementById(id);
const input = $("q"), list = $("list"), status = $("status"), more = $("more");

// Chips
["All", "Magar", "नेपाली", "English"].forEach(name => {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.textContent = name;
  b.setAttribute("aria-pressed", String(name === language));
  b.addEventListener("click", () => {
    language = name;
    limit = PAGE;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    render();
  });
  $("chips").appendChild(b);
});

function fieldsFor(i, qLoose) {
  const x = index[i];
  switch (language) {
    case "Magar":   return [[x.magar, ""], [x.roman, ""], [x.romanLoose, qLoose]];
    case "नेपाली":   return [[x.nepali, ""]];
    case "English": return [[x.english, ""]];
    default:        return [[x.magar, ""], [x.roman, ""], [x.romanLoose, qLoose], [x.nepali, ""], [x.english, ""]];
  }
}

// 0 = exact, 1 = starts with, 2 = contains, null = no match
function rank(i, q, qLoose) {
  let best = null;
  for (const [text, loosePart] of fieldsFor(i, qLoose)) {
    const needle = loosePart || q;
    if (!needle) continue;
    let r = null;
    if (text === needle) r = 0;
    else if (text.startsWith(needle)) r = 1;
    else if (text.includes(needle)) r = 2;
    if (r !== null && (best === null || r < best)) best = r;
  }
  return best;
}

function search(query) {
  const q = norm(query);
  if (!q) return [];
  const qLoose = loose(query);
  const hits = [];
  for (let i = 0; i < WORDS.length; i++) {
    const r = rank(i, q, qLoose);
    if (r !== null) hits.push([r, i]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return hits.map(h => h[1]);
}

function line(tag, cls, text) {
  const el = document.createElement(tag);
  el.className = cls;
  el.textContent = text;
  return el;
}

function render() {
  const query = input.value;
  const hits = search(query);
  const shown = hits.slice(0, limit);

  list.textContent = "";
  const frag = document.createDocumentFragment();
  for (const i of shown) {
    const w = WORDS[i];
    const li = document.createElement("li");
    li.className = "entry";
    li.appendChild(line("p", "magar", w.magar));
    if (w.romanized) li.appendChild(line("p", "roman", w.romanized));
    li.appendChild(line("p", "nepali", w.nepali));
    if (w.english) li.appendChild(line("p", "english", w.english));
    frag.appendChild(li);
  }
  list.appendChild(frag);

  if (!WORDS.length) {
    status.textContent = "The word list did not load.";
  } else if (!norm(query)) {
    status.textContent = "";
  } else if (!hits.length) {
    status.textContent = "No words found for “" + query.trim() + "”. Try fewer letters or another language.";
  } else {
    status.textContent = hits.length + (hits.length === 1 ? " word found" : " words found");
  }
  more.hidden = hits.length <= limit;
}

input.addEventListener("input", () => { limit = PAGE; render(); });
more.addEventListener("click", () => { limit += PAGE; render(); });

if (APK_URL) {
  $("apk").href = APK_URL;
  $("apkWrap").hidden = false;
}

render();
</script>
