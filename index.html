<title>Magar Dictionary</title>

<style>
:root {
  --bg: #f2f6f3;
  --surface: #ffffff;
  --ink: #15231c;
  --muted: #5b6b62;
  --line: #d3ddd6;
  --magar: #176b4d;
  --nepali: #1565c0;
  --focus: #176b4d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1a15;
    --surface: #17261f;
    --ink: #e8f0ea;
    --muted: #9db0a5;
    --line: #2b4036;
    --magar: #5fd3a2;
    --nepali: #7ab4ff;
    --focus: #5fd3a2;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Nirmala UI", sans-serif;
  line-height: 1.5;
}
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; color: var(--magar); }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem .75rem; }
.apkwrap { margin: 0 0 0 auto; }
.sub { margin: .6rem 0 1.25rem; color: var(--muted); }
.search {
  width: 100%;
  font: inherit;
  font-size: 1.125rem;
  padding: .85rem 1rem;
  border: 2px solid var(--line);
  border-radius: .5rem;
  background: var(--surface);
  color: var(--ink);
}
.search:focus-visible, .chip:focus-visible, .more:focus-visible, .apk:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
.hint { margin: .75rem 0 0; color: var(--muted); font-size: .95rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
.chip {
  font: inherit;
  padding: .35rem .9rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--magar); border-color: var(--magar); color: var(--bg); font-weight: 600; }
.picker { margin: 0 0 1rem; }
.picker input { font: inherit; max-width: 100%; }
.status { margin: 0 0 .75rem; color: var(--muted); font-size: .95rem; }
.list { list-style: none; margin: 0; padding: 0; }
.entry { padding: .9rem 0 .9rem 1rem; border-left: 4px solid var(--magar); border-bottom: 1px solid var(--line); }
.magar { margin: 0; font-size: 1.35rem; font-weight: 700; font-style: italic; color: var(--magar); }
.roman { margin: 0; color: var(--magar); }
.nepali { margin: .35rem 0 0; font-size: 1.15rem; font-weight: 600; color: var(--nepali); }
.english { margin: .1rem 0 0; color: var(--ink); }
.more {
  display: block; margin: 1.25rem auto 0; font: inherit; padding: .6rem 1.4rem;
  border: 1px solid var(--magar); border-radius: .5rem; background: transparent; color: var(--magar); cursor: pointer;
}
.apk {
  display: inline-block; padding: .4rem .85rem; border-radius: .5rem; font-size: .9rem; white-space: nowrap;
  background: var(--magar); color: var(--bg); text-decoration: none; font-weight: 600;
}
footer { margin-top: 2.5rem; color: var(--muted); font-size: .9rem; }
</style>
</head>

<main>

  <div id="picker" class="picker" hidden>
    <label for="csvFile">Choose the word list file: </label>

  </div>

  <p id="status" class="status" aria-live="polite"></p>
  <ul id="list" class="list"></ul>
  <button id="more" class="more" hidden>Show more</button>

</main>

    render();
  });
  $("chips").appendChild(b);
});

function fieldsFor(i, qLoose) {
  const x = index[i];
  switch (language) {
    case "Magar":   return [[x.magar, ""], [x.roman, ""], [x.romanLoose, qLoose]];
    case "नेपाली":   return [[x.nepali, ""]];
    case "English": return [[x.english, ""]];
    default:        return [[x.magar, ""], [x.roman, ""], [x.romanLoose, qLoose], [x.nepali, ""], [x.english, ""]];
  }
}

// 0 = exact, 1 = starts with, 2 = contains, null = no match
function rank(i, q, qLoose) {
  let best = null;
  for (const [text, loosePart] of fieldsFor(i, qLoose)) {
    const needle = loosePart || q;
    if (!needle) continue;
    let r = null;
    if (text === needle) r = 0;
    else if (text.startsWith(needle)) r = 1;
    else if (text.includes(needle)) r = 2;
    if (r !== null && (best === null || r < best)) best = r;
  }
  return best;
}

function search(query) {
  const q = norm(query);
  if (!q) return [];
  const qLoose = loose(query);
  const hits = [];
  for (let i = 0; i < WORDS.length; i++) {
    const r = rank(i, q, qLoose);
    if (r !== null) hits.push([r, i]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return hits.map(h => h[1]);
}

function line(tag, cls, text) {
  const el = document.createElement(tag);
  el.className = cls;
  el.textContent = text;
  return el;
}

function render() {
  const query = input.value;
  const hits = search(query);
  const shown = hits.slice(0, limit);

  list.textContent = "";
  const frag = document.createDocumentFragment();
  for (const i of shown) {
    const w = WORDS[i];
    const li = document.createElement("li");
    li.className = "entry";
    li.appendChild(line("p", "magar", w.magar));
    if (w.romanized) li.appendChild(line("p", "roman", w.romanized));
    li.appendChild(line("p", "nepali", w.nepali));
    if (w.english) li.appendChild(line("p", "english", w.english));
    frag.appendChild(li);
  }
  list.appendChild(frag);

  if (!WORDS.length) {
    status.textContent = loadError;
  } else if (!norm(query)) {
    status.textContent = "";
  } else if (!hits.length) {
    status.textContent = "No words found for “" + query.trim() + "”. Try fewer letters or another language.";
  } else {
    status.textContent = hits.length + (hits.length === 1 ? " word found" : " words found");
  }
  more.hidden = hits.length <= limit;
}

input.addEventListener("input", () => { limit = PAGE; render(); });
more.addEventListener("click", () => { limit += PAGE; render(); });

if (APK_URL) {
  $("apk").href = APK_URL;
  $("apkWrap").hidden = false;
}

// Columns, in order: No. | Dhut Magar | Dhut_Romanize | Khas Nepali | English
function parseCSV(text) {
  const nl = text.indexOf("\n");
  const header = nl === -1 ? text : text.slice(0, nl);
  // Use whichever separator appears most in the header row.
  const delim = ["\t", ",", ";", "|"]
    .map(d => [d, header.split(d).length - 1])
    .sort((a, b) => b[1] - a[1])[0][0];

  const rows = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
      } else field += c;
    } else if (c === '"') quoted = true;
    else if (c === delim) { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// Find each column by its header name; fall back to fixed positions if the headers are not recognised.
function columnMap(header) {
  const h = header.map(x => norm(x));
  const find = key => h.findIndex(x => x.includes(key));
  let m = { magar: find("magar"), romanized: find("roman"), nepali: find("nepali"), english: find("english") };
  if (m.magar < 0 || m.nepali < 0) {
    m = header.length >= 5 ? { magar: 1, romanized: 2, nepali: 3, english: 4 }
      : header.length === 4 ? { magar: 0, romanized: 1, nepali: 2, english: 3 }
      : { magar: 0, romanized: -1, nepali: 1, english: 2 };
  }
  return m;
}

function applyCsv(raw) {
  const rows = parseCSV(raw.replace(/^\uFEFF/, ""));
  const header = rows[0] || [];
  if (header.length < 3) {
    throw new Error("PARSE: read " + rows.length + " lines; columns found: " + (header.join(" | ") || "none"));
  }
  const m = columnMap(header);
  const cell = (r, i) => (i >= 0 && i < r.length ? r[i].trim() : "");
  const words = rows.slice(1)
    .map(r => ({
      magar: cell(r, m.magar),
      romanized: cell(r, m.romanized),
      nepali: cell(r, m.nepali),
      english: cell(r, m.english)
    }))
    .filter(w => w.magar);
  if (!words.length) {
    throw new Error("PARSE: read " + rows.length + " lines; columns found: " + (header.join(" | ") || "none"));
  }
  WORDS = words;
  index = buildIndex();
  loadError = "";
}

function describeError(e) {
  if (String(e.message).startsWith("PARSE:")) {
    return "The file " + CSV_URL + " was found, but no words could be read from it (" + e.message.slice(7) +
      "). The first row should name the columns Dhut Magar, Dhut_Romanize, Khas Nepali and English.";
  }
  return "The file " + CSV_URL + " was found, but it could not be processed (" + e.message + ").";
}

async function loadWords() {
  // 1. Show the built-in copy straight away.
  if (EMBEDDED_CSV) {
    try {
      applyCsv(EMBEDDED_CSV);
    } catch (e) {
      console.error("The built-in word list could not be read", e);
    }
    render();
  }

  // 2. Replace it with the data file when the page is served from a web address.
  try {
    const res = await fetch(CSV_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    applyCsv(await res.text());
  } catch (e) {
    console.info("Using the built-in word list. Could not read " + CSV_URL + ": " + e.message);
    if (!WORDS.length) {
      if (String(e.message).startsWith("PARSE:")) {
        loadError = describeError(e);
      } else if (location.protocol === "file:") {
        // Browsers block a page opened from a file from reading other files, so ask for the CSV instead.
        loadError = "Browsers do not let a page read other files by itself when it is opened from your computer. Choose " + CSV_URL + " below to load the words.";
        $("picker").hidden = false;
      } else {
        loadError = "Could not load the word list. The browser could not get " + CSV_URL + " (" + e.message +
          "). Check that the file is in the same folder as index.html and that its name matches exactly, including capital letters.";
      }
    }
  }
  render();
}

$("csvFile").addEventListener("change", async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    applyCsv(await file.text());
    $("picker").hidden = true;
  } catch (e) {
    loadError = describeError(e);
  }
  render();
});

loadWords();
</script>
